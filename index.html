<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitness Center Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="calendar-app">
    <section class="calendar-panel">
      <header class="calendar-header">
        <div class="month-controls">
          <button id="prevMonth" class="nav-button" aria-label="Previous month">◀</button>
          <div class="month-label">
            <select id="monthSelect"></select>
            <span id="yearLabel"></span>
          </div>
          <button id="nextMonth" class="nav-button" aria-label="Next month">▶</button>
        </div>
        <div class="calendar-actions">
          <button id="addClassBtn" class="primary-button">Add Class</button>
          <button id="printMonthBtn" class="secondary-button">Print Month</button>
        </div>
      </header>

      <div class="print-header">
        <h1>Big Cedar Wellness Calendar</h1>
        <p id="printMonthLabel"></p>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>
    </section>

    <aside class="editor-panel">
      <div class="editor-card">
        <h2>Class Details</h2>
        <form id="classForm">
          <label>
            Date
            <input type="text" id="selectedDate" name="date" readonly />
          </label>

          <label>
            Class
            <select id="classTitle" name="title" required>
              <option value="">Select a class</option>
            </select>
          </label>

          <label>
            Time
            <input type="time" id="classTime" name="time" required />
          </label>

          <div class="form-buttons">
            <button type="submit" class="primary-button">Save</button>
            <button type="button" id="deleteClassBtn" class="danger-button">Delete</button>
          </div>
        </form>

        <div class="info-box">
          <p>Click any day to view or save a class for that date. Then use Print Month to create a full calendar layout for monthly review.</p>
        </div>
      </div>
    </aside>
  </main>

  <template id="dayTemplate">
    <div class="day-card">
      <div class="day-header">
        <span class="day-number"></span>
        <span class="weekday"></span>
      </div>
      <div class="class-list"></div>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
